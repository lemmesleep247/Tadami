name: CI

permissions:
  contents: write

on:
  push:
    branches:
      - '*'

  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.0)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # ---------------------------------------------------------
      # Manual release
      # Enter "1.0.0" -> creates tag "v1.0.0"
      # ---------------------------------------------------------
      - name: Create version tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail

          VERSION="${{ inputs.version }}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"
            echo "Version must be in the format X.Y.Z, for example 1.0.0"
            exit 1
          fi

          TAG="v${VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "${TAG}"
          git push origin "${TAG}"

          echo "VERSION_TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0

      - name: Check code format
        run: ./gradlew spotlessCheck

      # ---------------------------------------------------------
      # Normal branch builds
      # ---------------------------------------------------------
      - name: Build app (quick)
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: ./gradlew assembleDebug --console=plain

      # ---------------------------------------------------------
      # Main and manual releases
      # ---------------------------------------------------------
      - name: Build app (release)
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail

          ./gradlew assembleRelease -Penable-updater --console=plain 2>&1 | tee build_release.log
          python3 tools/ci/report-release-warnings.py build_release.log --enforce

      # ---------------------------------------------------------
      # Artifacts
      # ---------------------------------------------------------
      - name: Upload APK
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arm64-v8a-${{ github.sha }}
          path: app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk

      - name: Upload mapping
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mapping-${{ github.sha }}
          path: app/build/outputs/mapping/release

      # ---------------------------------------------------------
      # Manual release only
      # ---------------------------------------------------------
      - name: Sign APK
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.repository == 'aniyomiorg/aniyomi'
        uses: r0adkll/sign-android-release@f30bdd30588842ac76044ecdbd4b6d0e3e813478
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Clean up build artifacts
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.repository == 'aniyomiorg/aniyomi'
        run: |
          set -euo pipefail

          mv app/build/outputs/apk/release/app-universal-release-unsigned-signed.apk \
            "aniyomi-${VERSION_TAG}.apk"
          sha=$(sha256sum "aniyomi-${VERSION_TAG}.apk" | awk '{ print $1 }')
          echo "APK_UNIVERSAL_SHA=$sha" >> "$GITHUB_ENV"

          mv app/build/outputs/apk/release/app-arm64-v8a-release-unsigned-signed.apk \
            "aniyomi-arm64-v8a-${VERSION_TAG}.apk"
          sha=$(sha256sum "aniyomi-arm64-v8a-${VERSION_TAG}.apk" | awk '{ print $1 }')
          echo "APK_ARM64_V8A_SHA=$sha" >> "$GITHUB_ENV"

          mv app/build/outputs/apk/release/app-armeabi-v7a-release-unsigned-signed.apk \
            "aniyomi-armeabi-v7a-${VERSION_TAG}.apk"
          sha=$(sha256sum "aniyomi-armeabi-v7a-${VERSION_TAG}.apk" | awk '{ print $1 }')
          echo "APK_ARMEABI_V7A_SHA=$sha" >> "$GITHUB_ENV"

          mv app/build/outputs/apk/release/app-x86-release-unsigned-signed.apk \
            "aniyomi-x86-${VERSION_TAG}.apk"
          sha=$(sha256sum "aniyomi-x86-${VERSION_TAG}.apk" | awk '{ print $1 }')
          echo "APK_X86_SHA=$sha" >> "$GITHUB_ENV"

          mv app/build/outputs/apk/release/app-x86_64-release-unsigned-signed.apk \
            "aniyomi-x86_64-${VERSION_TAG}.apk"
          sha=$(sha256sum "aniyomi-x86_64-${VERSION_TAG}.apk" | awk '{ print $1 }')
          echo "APK_X86_64_SHA=$sha" >> "$GITHUB_ENV"

      - name: Create Release
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.repository == 'aniyomiorg/aniyomi'
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: Aniyomi ${{ env.VERSION_TAG }}
          body: |
            ---

            ### Checksums

            | Variant | SHA-256 |
            | ------- | ------- |
            | Universal | ${{ env.APK_UNIVERSAL_SHA }} |
            | arm64-v8a | ${{ env.APK_ARM64_V8A_SHA }} |
            | armeabi-v7a | ${{ env.APK_ARMEABI_V7A_SHA }} |
            | x86 | ${{ env.APK_X86_SHA }} |
            | x86_64 | ${{ env.APK_X86_64_SHA }} |
          files: |
            aniyomi-${{ env.VERSION_TAG }}.apk
            aniyomi-arm64-v8a-${{ env.VERSION_TAG }}.apk
            aniyomi-armeabi-v7a-${{ env.VERSION_TAG }}.apk
            aniyomi-x86-${{ env.VERSION_TAG }}.apk
            aniyomi-x86_64-${{ env.VERSION_TAG }}.apk
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
